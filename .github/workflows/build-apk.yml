name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Check APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"
          mkdir -p release_out
          cp "$APK_PATH" release_out/jev-chat-abinapi-v1.2.apk
          echo "apk_path=release_out/jev-chat-abinapi-v1.2.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-abinapi-apk
          path: release_out/jev-chat-abinapi-v1.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2-abin
          name: "Jev Chat JARVIS v1.2 (AbinAPI Edition)"
          body: |
            ### Jev Chat JARVIS (AbinAPI & Universal OpenAI Edition)
            - 适配 AbinAPI 及任意 OpenAI 兼容中转站
            - 支持自定义 Base URL
            - 支持 DeepSeek / Qwen / GLM 系列模型进行意图分析与智能起草
            - 自带签名，安装即用
          files: release_out/jev-chat-abinapi-v1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
